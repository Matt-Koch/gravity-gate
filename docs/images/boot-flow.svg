<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>From power-on to a working role</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a0c2"/>
    </marker>
    <style>
      .box{fill:#131a2e;stroke:#2a3558;stroke-width:2}
      .key{fill:#1b2440;stroke:#ffd23f;stroke-width:2.5}
      .h{fill:#ffd23f;font-weight:700;font-size:15px}
      .t{fill:#eef2ff;font-size:13.5px}
      .m{fill:#94a0c2;font-size:12px}
      .ar{stroke:#94a0c2;stroke-width:2.5;fill:none}
    </style>
  </defs>
  <rect width="1000" height="300" rx="18" fill="#0b1020"/>
  <text x="30" y="38" class="h" font-size="19">Every box, every time it boots</text>

  <rect x="30" y="80" width="160" height="150" rx="12" class="box"/>
  <text x="110" y="108" class="h" text-anchor="middle">1. Power on</text>
  <text x="110" y="135" class="t" text-anchor="middle">with a monitor</text>
  <text x="110" y="153" class="t" text-anchor="middle">and keyboard</text>
  <text x="110" y="185" class="m" text-anchor="middle">same image</text>
  <text x="110" y="201" class="m" text-anchor="middle">on every box</text>

  <rect x="230" y="80" width="190" height="150" rx="12" class="box"/>
  <text x="325" y="108" class="h" text-anchor="middle">2. It introduces itself</text>
  <text x="325" y="138" fill="#ffd23f" font-size="28" font-weight="800" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace">A3F2</text>
  <text x="325" y="162" class="t" text-anchor="middle">ID · IP · hardware</text>
  <text x="325" y="185" class="m" text-anchor="middle">display? camera? timer?</text>
  <text x="325" y="201" class="m" text-anchor="middle">and looks for the brain</text>

  <rect x="470" y="62" width="230" height="78" rx="12" class="key"/>
  <text x="585" y="88" class="h" text-anchor="middle">3a. Its own keyboard</text>
  <text x="585" y="112" class="t" text-anchor="middle">B Brain · F Finish · D Display</text>
  <text x="585" y="129" class="m" text-anchor="middle">S = standby</text>
  <rect x="470" y="168" width="230" height="78" rx="12" class="key"/>
  <text x="585" y="194" class="h" text-anchor="middle">3b. …or from the brain</text>
  <text x="585" y="218" class="t" text-anchor="middle">assign by ID, or Auto-arrange</text>
  <text x="585" y="235" class="m" text-anchor="middle">brain console or Admin → Fleet</text>

  <rect x="750" y="80" width="220" height="150" rx="12" class="box"/>
  <text x="860" y="108" class="h" text-anchor="middle">4. The role runs</text>
  <text x="860" y="136" class="t" text-anchor="middle">Brain: race control</text>
  <text x="860" y="156" class="t" text-anchor="middle">Finish: timer + camera</text>
  <text x="860" y="176" class="t" text-anchor="middle">Display: race screen</text>
  <text x="860" y="205" class="m" text-anchor="middle">remembered for next boot</text>

  <path d="M190 155 H228" class="ar" marker-end="url(#a)"/>
  <path d="M420 140 L468 104" class="ar" marker-end="url(#a)"/>
  <path d="M420 170 L468 205" class="ar" marker-end="url(#a)"/>
  <path d="M700 104 L748 140" class="ar" marker-end="url(#a)"/>
  <path d="M700 205 L748 170" class="ar" marker-end="url(#a)"/>
  <text x="30" y="276" class="m">The brain is always chosen on its own keyboard (press B). Everything else can be assigned either way.</text>
</svg>
