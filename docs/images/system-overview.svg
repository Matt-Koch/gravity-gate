<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Gravity Gate system overview</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a0c2"/>
    </marker>
    <style>
      .box{fill:#131a2e;stroke:#2a3558;stroke-width:2}
      .pi{fill:#1b2440;stroke:#ffd23f;stroke-width:2.5}
      .h{fill:#ffd23f;font-weight:700;font-size:17px}
      .t{fill:#eef2ff;font-size:14px}
      .m{fill:#94a0c2;font-size:12.5px}
      .wire{stroke:#94a0c2;stroke-width:2.5;fill:none}
      .eth{stroke:#3d6bff;stroke-width:3;fill:none}
      .wifi{stroke:#2fd18b;stroke-width:2.5;fill:none;stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1000" height="580" rx="18" fill="#0b1020"/>
  <text x="30" y="40" class="h" font-size="20">How the pieces connect</text>
  <text x="30" y="62" class="m">Every box runs the same image. Its role (Brain, Finish line, Display) is picked on the day.</text>

  <!-- network switch -->
  <rect x="410" y="250" width="180" height="70" rx="12" class="box"/>
  <text x="500" y="279" class="t" text-anchor="middle" font-weight="600">Network</text>
  <text x="500" y="298" class="m" text-anchor="middle">Wi-Fi router + switch</text>
  <text x="500" y="313" class="m" text-anchor="middle">(or the brain's own hotspot)</text>

  <!-- brain -->
  <rect x="60" y="100" width="250" height="110" rx="14" class="pi"/>
  <text x="80" y="128" class="h">BRAIN</text><text x="160" y="128" class="m">top of the track</text>
  <text x="80" y="152" class="t">Race control + database</text>
  <text x="80" y="172" class="t">Phone site + QR codes</text>
  <text x="80" y="195" class="m">Raspberry Pi 4/5 or Protectli</text>
  <!-- projector -->
  <rect x="60" y="250" width="250" height="64" rx="10" class="box"/>
  <text x="80" y="276" class="t" font-weight="600">Projector / big TV</text>
  <text x="80" y="296" class="m">race screen, standings, bracket</text>
  <path d="M185 210 V250" class="wire" marker-end="url(#a)"/>
  <text x="195" y="236" class="m">HDMI</text>
  <!-- race director laptop -->
  <rect x="60" y="360" width="250" height="64" rx="10" class="box"/>
  <text x="80" y="386" class="t" font-weight="600">Race director (laptop/tablet)</text>
  <text x="80" y="406" class="m">browser → http://&lt;brain&gt;:8000/admin</text>

  <!-- finish line -->
  <rect x="690" y="100" width="250" height="110" rx="14" class="pi"/>
  <text x="710" y="128" class="h">FINISH LINE</text><text x="830" y="128" class="m">bottom</text>
  <text x="710" y="152" class="t">Reads the timer gantry</text>
  <text x="710" y="172" class="t">Photographs every finish</text>
  <text x="710" y="195" class="m">Pi + USB-serial + Pi camera</text>
  <rect x="690" y="250" width="118" height="64" rx="10" class="box"/>
  <text x="749" y="276" class="t" text-anchor="middle" font-weight="600">Timer</text>
  <text x="749" y="296" class="m" text-anchor="middle">gantry</text>
  <rect x="822" y="250" width="118" height="64" rx="10" class="box"/>
  <text x="881" y="276" class="t" text-anchor="middle" font-weight="600">Pi camera</text>
  <text x="881" y="296" class="m" text-anchor="middle">over the line</text>
  <path d="M749 250 V210" class="wire" marker-end="url(#a)"/>
  <text x="757" y="236" class="m">USB</text>
  <path d="M881 250 V210" class="wire" marker-end="url(#a)"/>
  <text x="889" y="236" class="m">ribbon</text>

  <!-- displays -->
  <rect x="690" y="380" width="250" height="90" rx="14" class="pi"/>
  <text x="710" y="408" class="h">DISPLAY ×1–3</text>
  <text x="710" y="432" class="t">Race screen full-screen</text>
  <text x="710" y="452" class="m">TV in the hallway, pit area, stage…</text>
  <rect x="690" y="495" width="250" height="50" rx="10" class="box"/>
  <text x="815" y="525" class="t" text-anchor="middle">TV / monitor</text>
  <path d="M815 470 V495" class="wire" marker-end="url(#a)"/>

  <!-- phones -->
  <rect x="410" y="420" width="180" height="110" rx="14" class="box"/>
  <text x="500" y="448" class="t" text-anchor="middle" font-weight="600">Families' phones</text>
  <text x="500" y="470" class="m" text-anchor="middle">scan the QR code</text>
  <text x="500" y="488" class="m" text-anchor="middle">live results, my Scout,</text>
  <text x="500" y="506" class="m" text-anchor="middle">photo finishes</text>

  <!-- network links -->
  <path d="M310 155 C 370 155, 380 270, 410 275" class="eth"/>
  <path d="M690 155 C 630 155, 620 270, 590 275" class="eth"/>
  <path d="M690 425 C 630 425, 620 320, 590 300" class="eth"/>
  <path d="M310 392 C 360 392, 380 320, 420 315" class="wifi"/>
  <path d="M500 420 V320" class="wifi"/>

  <!-- legend -->
  <path d="M40 548 H80" class="eth"/><text x="88" y="552" class="m">Ethernet (recommended for brain + finish line)</text>
  <path d="M400 548 H440" class="wifi"/><text x="448" y="552" class="m">Wi-Fi</text>
  <path d="M520 548 H560" class="wire"/><text x="568" y="552" class="m">cable</text>
</svg>
