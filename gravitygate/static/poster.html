<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Results Poster</title>
<style>
  @page { size: letter; margin: 0.5in; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0b1020; background: #fff; }
  .sheet { max-width: 7.5in; margin: 0 auto; padding: 0.4in 0; text-align: center; }
  h1 { font-size: 40px; margin: 0 0 4px; }
  .tag { font-size: 22px; color: #3d4466; margin: 0 0 28px; }
  .qrs { display: flex; justify-content: center; gap: 0.5in; flex-wrap: wrap; }
  figure { margin: 0; }
  figure img { width: 3.2in; height: 3.2in; border: 3px solid #0b1020; border-radius: 16px; padding: 6px; }
  figcaption { font-size: 20px; margin-top: 8px; }
  .step { display: inline-block; width: 34px; height: 34px; line-height: 34px; border-radius: 50%; background: #ffd23f; font-weight: 800; margin-right: 6px; }
  .url { font: 600 20px ui-monospace, monospace; background: #f1f3fa; padding: 6px 12px; border-radius: 8px; display: inline-block; margin-top: 4px; }
  ul { text-align: left; max-width: 5.5in; margin: 28px auto 0; font-size: 18px; }
  .no-print { margin: 16px; text-align: center; }
  .no-print button { font: inherit; padding: 8px 18px; border-radius: 8px; border: 1px solid #0b1020; background: #ffd23f; cursor: pointer; }
  @media print { .no-print { display: none; } }
</style>
</head>
<body>
<div class="no-print"><button onclick="print()">Print poster</button></div>
<div class="sheet">
  <h1 id="event">Pinewood Derby</h1>
  <p class="tag">Follow every race live on your phone 🏁</p>
  <div class="qrs" id="qrs"></div>
  <ul>
    <li>⭐ Star your Scout to see their next race, lane and times</li>
    <li>🏆 Live leaderboards for every den and the whole pack</li>
    <li>📸 Photo finishes for the close ones</li>
  </ul>
</div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
fetch('/api/join-info').then((r) => r.json()).then((j) => {
  document.getElementById('event').textContent = j.event_name;
  document.title = j.event_name + ' – Live Results';
  const wifi = j.wifi_ssid ? `<figure><img src="/api/qr.svg?target=wifi" alt="Join Wi-Fi">
    <figcaption><span class="step">1</span>Join Wi-Fi<br><span class="url">${esc(j.wifi_ssid)}</span></figcaption></figure>` : '';
  document.getElementById('qrs').innerHTML = wifi + `<figure><img src="/api/qr.svg" alt="Live results">
    <figcaption>${wifi ? '<span class="step">2</span>' : ''}Open live results<br><span class="url">${esc(j.spectator_url.replace(/^https?:\/\//, ''))}</span></figcaption></figure>`;
});
</script>
</body>
</html>
