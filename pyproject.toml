[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gravitygate"
version = "0.1.0"
description = "Pinewood derby race manager for Raspberry Pi: double elimination, photo finishes, live phone views."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pyserial>=3.5",
  "segno>=1.5",
  "websockets>=12",
]

[project.optional-dependencies]
camera = ["numpy>=1.24", "pillow>=10"]   # plus `sudo apt install python3-picamera2` on the Pi
sheets = ["gspread>=6"]                   # only for the service-account sync option
dev = ["pytest>=8", "httpx>=0.27", "numpy>=1.24", "pillow>=10"]

[project.scripts]
gravitygate = "gravitygate.__main__:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
include = ["gravitygate*"]

[tool.setuptools.package-data]
gravitygate = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
